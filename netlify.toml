[build]
  publish = "."

# Interne bestanden niet publiek tonen
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_devserver.ps1"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
