name: Nieuw ontwerp publiceren na Netlify-reset (eenmalig, 2026)

# Het gratis Netlify-tegoed is op tot 5 november 2026, daarom kon het nieuwe ontwerp
# nog niet gepubliceerd worden. Dit werkt elke dag tussen 6 en 15 november: staat het
# nieuwe ontwerp nog niet online (occasion.html bestaat niet op altenaautos.nl), dan
# wordt er een kleine wijziging gecommit zodat Netlify publiceert. Is het online, dan
# gebeurt er niets. Na 2026 doet deze taak niets meer.

on:
  schedule:
    - cron: "0 10 6-15 11 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controleren of het nieuwe ontwerp al online staat
        id: check
        run: |
          if [ "$(date +%Y)" != "2026" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif curl -fsI https://altenaautos.nl/occasion.html > /dev/null; then
            echo "Nieuw ontwerp staat al online."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicatie starten
        if: steps.check.outputs.needed == 'true'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy-marker.txt
          git config user.name "Altena sync"
          git config user.email "sync@users.noreply.github.com"
          git add deploy-marker.txt
          git commit -m "Publicatie starten na Netlify-reset"
          git push
